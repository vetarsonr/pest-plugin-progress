name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Pest ${{ matrix.stack.pest }} / PHP ${{ matrix.stack.php }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        stack:
          - { pest: 2, php: '8.1' }
          - { pest: 2, php: '8.2' }
          - { pest: 2, php: '8.3' }
          - { pest: 3, php: '8.2' }
          - { pest: 3, php: '8.3' }
          - { pest: 3, php: '8.4' }
          - { pest: 4, php: '8.3' }
          - { pest: 4, php: '8.4' }
          - { pest: 5, php: '8.4' }
          - { pest: 5, php: '8.5' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.stack.php }}
          tools: composer:v2
          coverage: none
      - name: Verify the minimum PHP syntax before resolving dependencies
        if: matrix.stack.php == '8.1'
        run: git ls-files -z -- '*.php' | xargs -0 -n 1 php -l
      - run: composer require --dev "pestphp/pest:^${{ matrix.stack.pest }}.0" -W --prefer-dist --no-interaction --no-progress
      - run: composer test
